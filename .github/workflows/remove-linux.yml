# One-off: removes the Linux builds (linux-latest and the Linux files in the Windows releases). Deleted afterwards.
name: Remove Linux builds
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-linux.yml]
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete linux-latest and the Linux files
        run: |
          set -e
          if gh release view linux-latest >/dev/null 2>&1; then gh release delete linux-latest --cleanup-tag -y; fi
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            for a in $(gh release view "$tag" --json assets -q '.assets[].name' | grep -E '\.(AppImage|deb)$|^latest-linux\.yml$' || true); do
              echo "delete $tag/$a"
              gh release delete-asset "$tag" "$a" -y
            done
          done
