name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK; AGP installs missing platform packages itself.
      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Compile errors as annotations, so they are readable from the run summary / API.
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -80 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: abs-player-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="android-v${VERSION}-build${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "abs-player-android-${VERSION}.apk"
          gh release create "$TAG" "abs-player-android-${VERSION}.apk" --title "ABS Player pro Android ${VERSION} (build ${{ github.run_number }})" --notes "Commit ${{ github.sha }}" --latest
