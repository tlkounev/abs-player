name: Windows

on:
  push:
    branches: [main]
    paths:
      - "win/**"
      - "reader/**"
      - "i18n/**"
      - ".github/workflows/win.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: win

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Texts up to date (i18n/strings.py → generated files)
        run: python3 ../i18n/gen.py --check

      - name: Protocol tests
        run: node --test test/remote.test.js test/popup-size.test.js

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: win/package-lock.json
      - run: npm ci
      - name: Build installer + zip
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: abs-player-win
          path: |
            win/dist/*.exe
            win/dist/*.zip
          if-no-files-found: error
      # A release only for a new version: the updater compares versions, so a build of an already
      # released version would only add noise (bump the version in package.json to ship a fix).
      - name: New version?
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release list --limit 300 --json tagName -q '.[].tagName' | grep -q "^win-v${VERSION}-build"; then
            echo "::notice::Windows ${VERSION} is already released – no new release (bump the version to publish)"
          else
            echo "NEW_VERSION=1" >> "$GITHUB_ENV"
          fi

      - name: Publish release
        if: env.NEW_VERSION == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="win-v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" dist/*.exe dist/*.zip --title "ABS Player for Windows and Linux ${VERSION} (build ${{ github.run_number }})" --notes "Commit ${{ github.sha }}" --latest
          # keep the newest 10 releases of this app (the updater needs only the newest); older ones go with their tags
          gh release list --limit 300 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[].tagName' |
            grep "^win-v" | tail -n +11 | while read -r old; do gh release delete "$old" --cleanup-tag -y; done

      # Fixed release "win-latest" = update feed for electron-updater (latest.yml + installer + blockmap)
      # and the direct download link in the README (ABS-Player-Setup.exe, a copy under a fixed name).
      - name: Update feed + direct download (win-latest)
        if: env.NEW_VERSION == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release view win-latest >/dev/null 2>&1 || \
            gh release create win-latest --title "ABS Player for Windows – latest" \
              --notes "Always the newest Windows installer under a fixed name: ABS-Player-Setup.exe. The app also uses this release for its automatic updates." --latest=false
          gh release edit win-latest --title "ABS Player for Windows – latest (${VERSION})" \
            --notes "Always the newest Windows installer under a fixed name: ABS-Player-Setup.exe. The app also uses this release for its automatic updates."
          cp dist/ABS-Player-Setup-*.exe ABS-Player-Setup.exe
          NEW=$( (ls dist/*.exe dist/*.exe.blockmap dist/latest.yml | xargs -n1 basename; echo ABS-Player-Setup.exe) )
          gh release upload win-latest dist/*.exe dist/*.exe.blockmap dist/latest.yml ABS-Player-Setup.exe --clobber
          for a in $(gh release view win-latest --json assets -q '.assets[].name'); do
            echo "$NEW" | grep -qxF "$a" || gh release delete-asset win-latest "$a" -y
          done

  # The same app for Linux: AppImage (updates itself) and .deb. Added to this run's release (made by the
  # Windows job when the version is new) and to "linux-latest" (update feed + fixed download names).
  linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: win/package-lock.json
      - run: npm ci
      - name: Build AppImage + deb
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: abs-player-linux
          path: |
            win/dist/*.AppImage
            win/dist/*.deb
          if-no-files-found: error
      - name: Add to the release + linux-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # the release of this version (made by the Windows job, in this run or an earlier one)
          TAG=$(gh release list --limit 300 --json tagName -q '.[].tagName' | grep "^win-v${VERSION}-build" | head -1 || true)
          if [ -z "$TAG" ]; then
            echo "::notice::Version ${VERSION} has no release – nothing to add"
            exit 0
          fi
          if gh release view linux-latest --json assets -q '.assets[].name' 2>/dev/null | grep -qxF "ABS-Player-${VERSION}-x86_64.AppImage"; then
            echo "::notice::Linux ${VERSION} is already published"
            exit 0
          fi
          gh release upload "$TAG" dist/*.AppImage dist/*.deb --clobber
          gh release view linux-latest >/dev/null 2>&1 || \
            gh release create linux-latest --title "ABS Player for Linux – latest" --latest=false \
              --notes "Always the newest Linux build under fixed names: ABS-Player.AppImage, abs-player.deb. The AppImage also uses this release for its automatic updates."
          gh release edit linux-latest --title "ABS Player for Linux – latest (${VERSION})" \
            --notes "Always the newest Linux build under fixed names: ABS-Player.AppImage, abs-player.deb. The AppImage also uses this release for its automatic updates."
          cp dist/ABS-Player-*.AppImage ABS-Player.AppImage
          cp dist/ABS-Player-*.deb abs-player.deb
          FILES="$(ls dist/*.AppImage dist/*.deb dist/latest-linux.yml) $(ls dist/*.blockmap 2>/dev/null || true) ABS-Player.AppImage abs-player.deb"
          gh release upload linux-latest $FILES --clobber
          NEW=$(for f in $FILES; do basename "$f"; done)
          for a in $(gh release view linux-latest --json assets -q '.assets[].name'); do
            echo "$NEW" | grep -qxF "$a" || gh release delete-asset linux-latest "$a" -y
          done
