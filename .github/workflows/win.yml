name: Windows

on:
  push:
    branches: [main]
    paths:
      - "win/**"
      - "reader/**"
      - ".github/workflows/win.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: win

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Protocol tests
        run: node --test test/remote.test.js

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: win/package-lock.json
      - run: npm ci
      - name: Build installer + zip
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: abs-player-win
          path: |
            win/dist/*.exe
            win/dist/*.zip
          if-no-files-found: error
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="win-v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" dist/*.exe dist/*.zip --title "ABS Player for Windows ${VERSION} (build ${{ github.run_number }})" --notes "Commit ${{ github.sha }}" --latest

      # Fixed release "win-latest" = update feed for electron-updater (latest.yml + installer + blockmap)
      # and the direct download link in the README (ABS-Player-Setup.exe, a copy under a fixed name).
      - name: Update feed + direct download (win-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release view win-latest >/dev/null 2>&1 || \
            gh release create win-latest --title "ABS Player for Windows – latest" \
              --notes "Always the newest Windows installer under a fixed name: ABS-Player-Setup.exe. The app also uses this release for its automatic updates." --latest=false
          gh release edit win-latest --title "ABS Player for Windows – latest (${VERSION})" \
            --notes "Always the newest Windows installer under a fixed name: ABS-Player-Setup.exe. The app also uses this release for its automatic updates."
          cp dist/ABS-Player-Setup-*.exe ABS-Player-Setup.exe
          NEW=$( (ls dist/*.exe dist/*.exe.blockmap dist/latest.yml | xargs -n1 basename; echo ABS-Player-Setup.exe) )
          gh release upload win-latest dist/*.exe dist/*.exe.blockmap dist/latest.yml ABS-Player-Setup.exe --clobber
          for a in $(gh release view win-latest --json assets -q '.assets[].name'); do
            echo "$NEW" | grep -qxF "$a" || gh release delete-asset win-latest "$a" -y
          done
