name: Screenshots

# README screenshots: a throw-away Audiobookshelf server with public-domain demo books,
# the debug APK on a phone and an Android TV emulator. Run by hand; the PNGs come as an artifact.
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            api: 34
            target: google_apis
            arch: x86_64
            profile: pixel_6
          - device: tv
            api: 30
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Demo library
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q pillow
          python3 tools/screenshots/make_library.py "$RUNNER_TEMP/library" tools/screenshots/alice.epub

      - name: Audiobookshelf server
        run: |
          docker run -d --name abs -p 13378:80 \
            -v "$RUNNER_TEMP/library:/audiobooks" -v "$RUNNER_TEMP/abs-config:/config" -v "$RUNNER_TEMP/abs-meta:/metadata" \
            ghcr.io/advplyr/audiobookshelf:latest
          python3 tools/screenshots/abs_seed.py http://localhost:13378

      - name: Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash tools/screenshots/android.sh ${{ matrix.device }} shots android/app/build/outputs/apk/debug/app-debug.apk

      - name: Server log
        if: always()
        run: docker logs abs 2>&1 | tail -60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.device }}
          path: shots/

  # Raw PNGs also on the orphan branch "screenshots-raw" (easier to fetch than artifacts).
  collect:
    needs: android
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: shots
      - name: Push to screenshots-raw
        run: |
          cd shots
          git init -q -b screenshots-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Raw screenshots from run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-raw
