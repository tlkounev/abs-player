name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK; AGP installs missing platform packages itself.
      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Compile errors as annotations, so they are readable from the run summary / API.
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -80 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: abs-player-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
