<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>ABS Player</title>
<style>
  :root { --bg:#f3f3f3; --fg:#1b1b1b; --muted:#5f5f5f; --field:#fff; --line:rgba(0,0,0,.15); --hover:rgba(0,0,0,.06); --menu:#f9f9f9; --accent:#c1781f; --accent-fg:#fff; --err:#c42b1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#232323; --fg:#f2f2f2; --muted:#a8a8a8; --field:#2d2d2d; --line:rgba(255,255,255,.14); --hover:rgba(255,255,255,.07); --menu:#2c2c2c; --accent:#e3a54d; --accent-fg:#1b1b1b; --err:#ff99a4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; padding-right: 150px; }
  p { margin: 0 0 18px; color: var(--muted); }
  input { width: 100%; padding: 8px 10px; font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-bottom: 2px solid var(--accent); border-radius: 4px; outline: none; }
  .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .primary { padding: 6px 18px; font: inherit; border-radius: 4px; border: 0; background: var(--accent); color: var(--accent-fg); }
  #err { color: var(--err); min-height: 20px; margin-top: 8px; font-size: 13px; }

  /* výběr jazyka */
  .lang { position: absolute; top: 20px; right: 20px; }
  .flag { width: 21px; height: 14px; flex: none; display: inline-flex; box-shadow: 0 0 0 1px rgba(0,0,0,.18); border-radius: 2px; overflow: hidden; }
  .flag svg { width: 100%; height: 100%; display: block; }
  #langBtn {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
    font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 4px;
  }
  #langBtn:hover { background: var(--hover); }
  #langBtn .chev { width: 10px; height: 10px; fill: currentColor; opacity: .7; }
  #langList {
    position: absolute; right: 0; top: 36px; z-index: 10; width: 190px; max-height: 236px; overflow-y: auto;
    background: var(--menu); border: 1px solid var(--line); border-radius: 6px; padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
  }
  #langList[hidden] { display: none; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; }
  .opt:hover, .opt.focus { background: var(--hover); }
  .opt.sel { font-weight: 600; }
  .opt .check { margin-left: auto; width: 12px; height: 12px; fill: var(--accent); visibility: hidden; }
  .opt.sel .check { visibility: visible; }
</style>
</head>
<body>
  <div class="lang">
    <button id="langBtn" type="button" aria-haspopup="listbox">
      <span class="flag" id="curFlag"></span><span id="curName"></span>
      <svg class="chev" viewBox="0 0 10 10"><path d="M1 3.2 5 7l4-3.8-.9-.9L5 5.2 1.9 2.3z"/></svg>
    </button>
    <div id="langList" role="listbox" hidden></div>
  </div>

  <h1 id="title"></h1>
  <p id="example"></p>
  <form id="f">
    <input id="url" autofocus placeholder="http://server:13378" spellcheck="false">
    <div id="err"></div>
    <div class="row"><button class="primary" type="submit" id="save"></button></div>
  </form>

<script src="i18n.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let lang = window.setup.lang();

  function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function apply() {
    const tr = (k, v) => I18N.tr(lang, k, v);
    document.documentElement.lang = lang;
    $('title').textContent = tr('setupTitle');
    $('example').innerHTML = esc(tr('setupExample', { a: '\u0000', b: '\u0001' }))
      .replace('\u0000', '<b>http://192.168.1.10:13378</b>')
      .replace('\u0001', '<b>https://abs.example.com</b>');
    $('save').textContent = tr('setupSave');
    $('langBtn').title = tr('language');
    const cur = I18N.LANGS.find((l) => l.code === lang);
    $('curFlag').innerHTML = cur.flag;
    $('curName').textContent = cur.name;
    for (const el of document.querySelectorAll('.opt')) el.classList.toggle('sel', el.dataset.code === lang);
    if ($('err').textContent) $('err').textContent = tr('setupInvalid');
  }

  // seznam jazyků
  const list = $('langList');
  for (const l of I18N.LANGS) {
    const o = document.createElement('div');
    o.className = 'opt';
    o.dataset.code = l.code;
    o.setAttribute('role', 'option');
    o.innerHTML = '<span class="flag">' + l.flag + '</span><span></span><svg class="check" viewBox="0 0 12 12"><path d="M4.5 9.3 1.2 6l.9-.9 2.4 2.4 5.4-5.4.9.9z"/></svg>';
    o.children[1].textContent = l.name;
    o.onclick = () => choose(l.code);
    list.append(o);
  }
  function openList(open) {
    list.hidden = !open;
    if (open) {
      const sel = list.querySelector('.sel');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    }
  }
  function choose(code) {
    lang = code;
    window.setup.setLang(code);
    apply();
    openList(false);
    $('url').focus();
  }
  $('langBtn').onclick = (e) => { e.stopPropagation(); openList(list.hidden); };
  document.addEventListener('click', (e) => { if (!list.contains(e.target)) openList(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openList(false); });
  window.setup.onLang((code) => { lang = code; apply(); });

  // formulář
  const q = new URLSearchParams(location.search);
  $('url').value = q.get('url') || '';
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    const v = $('url').value.trim();
    if (!v) return;
    const r = await window.setup.save(v);
    if (!r.ok) $('err').textContent = r.error;
  };

  apply();
</script>
</body>
</html>
