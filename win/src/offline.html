<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Audiobookshelf</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #232323; color: #f2f2f2; font: 14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; }
  p { color: #a8a8a8; }
  button { margin-top: 12px; padding: 7px 18px; font: inherit; border: 0; border-radius: 4px; background: #e3a54d; color: #1b1b1b; }
</style>
</head>
<body>
  <div>
    <h1 id="title"></h1>
    <p id="info"></p>
    <button id="retry"></button>
    <p id="auto"></p>
  </div>
<script src="i18n.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const lang = I18N.normalize(q.get('lang') || navigator.language);
  const tr = (k, v) => I18N.tr(lang, k, v);
  const url = q.get('url');
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = tr('offTitle');
  document.getElementById('info').textContent = url + (q.get('err') ? ' — ' + q.get('err') : '');
  document.getElementById('retry').textContent = tr('offRetry');
  const go = () => { location.href = url; };
  document.getElementById('retry').onclick = go;
  let n = 15;
  const tick = () => { document.getElementById('auto').textContent = tr('offAuto', { n }); };
  tick();
  setInterval(() => { n--; tick(); if (n <= 0) go(); }, 1000);
</script>
</body>
</html>
