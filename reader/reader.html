<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ABS Player – reader</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg, #1e1e1e); }
  #viewer { position: absolute; inset: 0; }
  #wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wait div { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(227,165,77,.25); border-top-color: #e3a54d; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="wait"><div></div></div>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
<script src="reader.js"></script>
</body>
</html>
